[package]
name = "brain-d"
version = "0.1.0"
edition = "2021"
description = "SIOS brain: briefing, planning, plan checks, routines, and the MCP door for outside AIs (D3, D4, D6, D14)"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
