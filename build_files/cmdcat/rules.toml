# Risk rules for the SIOS command catalog (D89). Read by build_files/cmdcat/cmdcat.py at
# image build; the broker only ever sees the result in catalog.json.
#
# Options that make a program run another program (tar --to-command, rsync -e, zip -TT...)
# are X. Shortened long options (--pag) count when they raise a class, never to lower it.
#
# Classes: R reads only (asks once per plan like reading files; read-only folders, no network)
#          C changes something on this computer (asks every time: commands have no undo)
#          X can't be undone (always asks)
#          S sends something out of the computer (always asks; network only then)
#          ask: not reviewed yet (asks), block: never for an AI
# A program, subcommand or flag with no rule is "ask". Commands never reach the system bus,
# the session bus, other programs' /proc or (unless S) the network, whatever their class. The highest class in a
# command (its default, its subcommand, any flag) wins, and in a pipeline the
# highest stage wins. Arguments are never run through a shell.

[block]
why = "changes who you are or the whole system: only you, in your own terminal"
names = [
  "sudo", "su", "pkexec", "run0", "doas", "sudoedit", "visudo", "passwd", "chpasswd", "chage", "usermod", "useradd", "userdel",
  "groupadd", "groupdel", "gpasswd", "newgrp", "chsh", "chfn",
  "bash", "sh", "zsh", "fish", "dash", "ksh", "csh", "tcsh", "busybox", "script", "expect", "eval", "exec", "xargs", "env", "nohup",
  "setsid", "unshare", "nsenter", "chroot", "systemd-run", "flatpak-spawn", "toolbox", "distrobox", "podman", "docker", "bwrap",
  "dd", "mkfs", "mkfs.ext4", "mkfs.btrfs", "mkfs.vfat", "mkfs.xfs", "mkswap", "fdisk", "sfdisk", "gdisk", "parted", "wipefs", "blkdiscard",
  "mount", "umount", "losetup", "cryptsetup", "lvm", "swapon", "swapoff",
  "shutdown", "reboot", "poweroff", "halt", "init", "telinit",
  "rpm-ostree", "bootc", "ostree", "dnf", "dnf5", "rpm", "grubby", "grub2-mkconfig", "efibootmgr", "dracut", "kexec",
  "insmod", "rmmod", "modprobe", "sysctl", "setenforce", "iptables", "nft", "firewall-cmd", "ip6tables",
  "crontab", "at", "batch", "loginctl", "machinectl", "ssh-keygen", "ssh-add", "gpg", "gpg2", "secret-tool", "kwallet-query",
  "kill", "killall", "pkill", "xkill", "less", "more", "most", "vi", "vim", "nano", "emacs", "top", "htop", "watch", "screen", "tmux",
]

# programs not asked for --help even without a man page (they act instead of helping)
[no_help]
names = ["konsole", "plasmashell", "kwin_wayland", "Xwayland", "startplasma-wayland", "sddm", "firefox", "kate", "dolphin"]

