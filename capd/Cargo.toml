[package]
name = "capd"
version = "0.1.0"
edition = "2021"
description = "SIOS capability daemon: proof of concept of the permission broker (D4, D20)"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
