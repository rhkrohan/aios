[package]
name = "capd"
version = "0.1.0"
edition = "2021"
description = "SIOS capability daemon: proof of concept of the permission broker (D4, D20)"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
getrandom = "0.2"
# the model gateway (D33): HTTPS to providers, keys encrypted at rest
ureq = { version = "2", features = ["json"] }
chacha20poly1305 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# KWin answers window questions over the session bus (A3, D68)
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
